services:
  pptp-vpn:
    build: ./pptp
    container_name: pptp-server
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp:/dev/ppp

  l2tp-vpn:
    build: ./l2tp
    container_name: l2tp-server
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/ppp:/dev/ppp
